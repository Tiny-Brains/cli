# THE PASS THIS REPOSITORY DEFINES, ON EVERY PUSH.
#
# Four things a push can prove. The crate is formatted, lints clean and builds from the lockfile.
# `cargo test` covers what needs no cartridge: the memory carry and its pricing, and the
# season-board name rule. The binary still does what the one repository every competitor clones
# asks of it: `ants-starter`'s own CI, run with THIS build. And `src/wave.rs` still plays a match
# the way Kalam's loop played it: `tinybrains conform` over fixtures/memflaky/replay.json, an
# envelope Kalam's own workflow wrote on the release the starter pins (CLAUDE.md, Rules). The
# starter clone is a test input and not a build input; nothing here compiles against it.

name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml names the exact compiler; `toolchain install` with no argument reads it.
      - name: Toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked --release -- -D warnings

      - name: Test
        run: cargo test --locked --release

      - name: Build
        run: cargo build --locked --release

      # The starter pins the Ants release in its games.toml, so this also exercises the release
      # fetch: download, both digests, unpack into the cache.
      - name: Play the starter kit with this build
        run: |
          bin="$PWD/target/release/tinybrains"
          "$bin" --version
          git clone --depth 1 https://github.com/Tiny-Brains/ants-starter "$RUNNER_TEMP/starter"
          cd "$RUNNER_TEMP/starter"
          "$bin" games
          "$bin" check model.onnx manifest.json
          "$bin" matches/self-play.json

      # The wave loop against Kalam's. Playing the fixture's match file puts its two graphs in the
      # store under the digests the replay names; conform then rebuilds the match Kalam played from
      # the envelope and diffs every turn. The seat struck from turn 3 keeps its memory through each
      # strike, forfeits at the ceiling and is omitted after, here as there. The replay was played on
      # the release the starter pins, and conform refuses another engine: when games.toml moves,
      # re-record it (scripts/record-replay.py).
      - name: Conform to a replay Kalam wrote
        env:
          TINYBRAINS_REGISTRY: ${{ runner.temp }}/starter/games.toml
        run: |
          bin="$PWD/target/release/tinybrains"
          "$bin" fixtures/memflaky/match.json --out "$RUNNER_TEMP/replays"
          "$bin" conform fixtures/memflaky/replay.json
