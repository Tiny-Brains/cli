# tinybrains -- one binary that plays a wave on a laptop. It loads a cartridge component through
# wasmtime, evaluates a manifest's adapters through datalogic and its graph through tract -- the
# same two libraries an Orion node uses, in the same order -- and writes the same replay envelope
# Kalam writes. None of them re-implementations.
#
# IT KNOWS NO GAME: five function names, `cartridge.json`, and the replay envelope. No Ants types,
# no engine crate. Adding a second game is an entry in a project's `games.toml` and no Rust.
#
# `version` IS THE RELEASE. A `v<version>` tag builds the binaries and the Homebrew formula
# (.github/workflows/release.yml), and the workflow refuses a tag that disagrees with this line.

[package]
name = "tinybrains"
version = "0.2.0"
edition = "2024"
publish = false
description = "Play, check and watch TinyBrains matches on a laptop"
license = "Apache-2.0"
repository = "https://github.com/Tiny-Brains/cli"

[[bin]]
name = "tinybrains"
path = "src/main.rs"

# EVERY DEPENDENCY IS HERE FOR A CALL THE BINARY MAKES, WITH ONLY THE FEATURES THAT CALL NEEDS.
# Compile time is wasmtime + cranelift and tract, which are the product; everything else is kept to
# the minimum so it adds little to them. Before adding a crate, check `cargo tree -i` for one
# already in the tree, and whether a crate here re-exports it (datalogic re-exports `bumpalo` and
# `datavalue`). Never take a command-line or tooling crate for one helper.
[dependencies]
# Matching what orion-server runs, so the component is executed here by the same runtime that
# executes it in production. `runtime` + `cranelift` to compile and call it, `component-model` for
# a plugin component's world. No cache, no parallel compilation, no debugging, no WAT.
wasmtime = { version = "48", default-features = false, features = ["runtime", "cranelift", "component-model", "std"] }

# THE EVALUATOR AND THE RUNTIME, as libraries rather than over HTTP -- and they are the node's own.
# datalogic is what evaluates a manifest's adapters on a node (Orion reaches it through
# dataflow-rs; the version must track what orion-server links, or `check` prices an adapter the
# ladder would price differently). The `ext-*` operator sets are the node's and cost no
# dependencies; dropping one is an adapter that passes on the ladder and fails here.
datalogic-rs = { version = "5.5", default-features = false, features = [
    "serde_json", "tensor", "budget",
    "ext-string", "ext-array", "ext-object", "ext-control", "ext-math",
] }
# tract is what runs the graph there. Only `tract-onnx`: the one helper once taken from
# `tract-libcli` (a shape spec parser) pulled in clap, tflite, npy, the GPU and Metal backends.
tract-onnx = { version = "0.23.7", default-features = false }
# The trait that decodes `tract_onnx::pb`; the same prost tract-onnx builds.
prost = { version = "0.14", default-features = false, features = ["std"] }

serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
# games.toml is read, never written: the parser and serde, no writer.
toml = { version = "1", default-features = false, features = ["std", "serde", "parse"] }
# Already in the tree through cranelift.
sha2 = { version = "0.10", default-features = false }
# HTTPS GET of a release archive or a model URL, and nothing else: rustls with ring and the bundled
# roots. 3.x rather than 2.x because 2.x parses URLs with `url`, which is `idna` and some twenty ICU
# crates.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# A cartridge release is one .tar.gz of the artifact set; both are already in the tree through
# tract. No xattr: an artifact set has no extended attributes to restore.
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[profile.release]
opt-level = 2
